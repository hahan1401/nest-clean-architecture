services:
  nest-clean-architecture-db:
    image: pgvector/pgvector:pg17
    container_name: nest-clean-architecture-db
    environment:
      PGDATA: /data/postgres
      POSTGRES_HOST_AUTH_METHOD: 'trust'
    volumes:
      - nest-clean-architecture-db:/data/postgres
    ports:
      - 5432:5432
    networks:
      - network
    restart: always

volumes:
  nest-clean-architecture-db:
networks:
  network:
    driver: bridge
