services:
  nest-clean-architecture:
    image: postgres
    container_name: nest-clean-architecture
    environment:
      PGDATA: /data/postgres
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - nest-clean-architecture-db:/data/postgres
    ports:
      - 5432:5432
    networks:
      - network
    restart: always
volumes:
  nest-clean-architecture-db:

networks:
  network:
    driver: bridge
